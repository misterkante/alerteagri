services:
  - type: web
    name: alerteagri-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run seed:prod && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alerteagri-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RECEIPT_SECRET
        generateValue: true
      - key: USSD_SECRET
        generateValue: true
      - key: SEED_STAFF_PIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: WEATHER_AUTO_REFRESH
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 7d

databases:
  - name: alerteagri-db
    plan: free
    region: frankfurt
